name: Build wordsmith

on:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [web, words, db]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Preparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, tag et push de ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/wordsmith:${{ matrix.service }}-latest
            ${{ vars.DOCKERHUB_USERNAME }}/wordsmith:${{ matrix.service }}-pr-${{ github.event.pull_request.number }}
            ${{ vars.DOCKERHUB_USERNAME }}/wordsmith:${{ matrix.service }}-${{ github.event.pull_request.head.sha }}